name: AOS-W portable distribution
on:
  push:
    branches: [main]
    paths:
      - "scaffold/aos-w/**"
      - "scripts/aosw-distribution.py"
      - "scripts/aosw-ops.py"
      - "tests/**"
      - ".github/workflows/aosw-portable.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  conformance-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OPTIONAL developer test dependencies
        run: python -m pip install pyyaml jsonschema
      - name: Run local conformance suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Build standalone release ZIP
        run: |
          mkdir -p dist
          python scripts/aosw-distribution.py build scaffold/aos-w dist/aos-w-portable-0.8.0.zip
          python scripts/aosw-distribution.py verify dist/aos-w-portable-0.8.0.zip
      - name: Test cold installation, initialization and upgrade preservation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aosw-distribution.py install dist/aos-w-portable-0.8.0.zip "$RUNNER_TEMP/install-a/aos-w"
          python scripts/aosw-ops.py list "$RUNNER_TEMP/install-a/aos-w"
          python scripts/aosw-ops.py init "$RUNNER_TEMP/install-a/aos-w" marketing-research-plan integration-test run-001 --actor '{"agent":"ci","platform":"github-actions","role":"tester","instance":"job-one"}' --parameters '{"research_question":"Compare fictional small-business buyer niches"}'
          python scripts/aosw-ops.py status "$RUNNER_TEMP/install-a/aos-w" integration-test run-001
          printf 'PRESERVE_ME\n' > "$RUNNER_TEMP/install-a/aos-w/agent-files/instances/integration-test/runs/run-001/artifacts/user-data.txt"
          python scripts/aosw-distribution.py upgrade dist/aos-w-portable-0.8.0.zip "$RUNNER_TEMP/install-a/aos-w"
          test "$(cat "$RUNNER_TEMP/install-a/aos-w/agent-files/instances/integration-test/runs/run-001/artifacts/user-data.txt")" = PRESERVE_ME
          python scripts/aosw-ops.py status "$RUNNER_TEMP/install-a/aos-w" integration-test run-001
      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: aos-w-portable-0.8.0
          path: dist/aos-w-portable-0.8.0.zip
          retention-days: 90
          if-no-files-found: error
      - name: Publish versioned preview release asset (best effort)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.8.0-portable-preview"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AOS-W 0.8.0 portable preview" --prerelease --notes "Portable manual AOS-W scaffold with read-only offline workflow visualization. No workflow engine, scheduler, or production multi-agent claim guarantee. The ZIP excludes developer files and all user-specific data."
          fi
          gh release upload "$TAG" dist/aos-w-portable-0.8.0.zip --clobber
          gh release view "$TAG" --json url,assets
