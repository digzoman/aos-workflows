name: AOS-W P18 synthetic marketing pilot
on:
  push:
    branches: [main]
    paths:
      - 'tests/acceptance/run_marketing_pilot.py'
      - '.github/workflows/aosw-p18-marketing-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional YAML parser
        run: python -m pip install pyyaml
      - name: Run synthetic stage pilot against actual AOS-W RunStore
        run: python tests/acceptance/run_marketing_pilot.py --evidence p18-evidence
      - name: Save synthetic pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-w-p18-synthetic-pilot
          path: p18-evidence/
          retention-days: 90
          if-no-files-found: warn
