schema_version: 1.0.0
template_id: periodic-review-example
version: 0.2.0
name: Optional recurring review declaration
description: Not a scheduler. Manually invoked or host-triggered if explicitly configured.
parameters:
  subject:
    type: string
    required: true
trigger:
  kind: schedule
  schedule:
    format: rrule
    expression: FREQ=WEEKLY;BYDAY=MO
    timezone: Etc/UTC
    enabled: false
    missed_policy: manual_review
    overlap_policy: block
policy:
  autonomy: bounded
  allowed_actions:
  - read
  - research
  - write_local
  - review
  human_required_actions:
  - stage_paused
  - activate_live
  - change_budget
  - deploy_prod
  - send_message
  - emit_conversion
  default_gates: []
  max_parallel_tasks: 1
  allow_dynamic_children: false
graph:
  nodes:
  - id: inspect
    kind: task
    needs: []
    instructions: Inspect permitted sources only when explicitly invoked.
    inputs: []
    outputs:
    - artifact_id: findings
      path: artifacts/findings.md
      required: true
    quality:
      gates: []
    contract:
      done_when: All declared output artifacts exist, are dated and have provenance; do not invent outcomes.
    required_actions:
    - read
    - write_local
  - id: summarize
    kind: task
    needs:
    - inspect
    instructions: Make dated summary and next-action recommendation.
    inputs:
    - from: inspect
      artifact_id: findings
      required: true
    outputs:
    - artifact_id: report
      path: artifacts/report.md
      required: true
    quality:
      gates: []
    contract:
      done_when: All declared output artifacts exist, are dated and have provenance; do not invent outcomes.
    required_actions:
    - read
    - write_local
