schema_version: 1.0.0
template_id: marketing-landing-page-setup
version: 0.7.0
name: Landing page and website preparation
description: Prepare offer pages, CTAs, UTMs, consent and DEV smoke tests. Drafts and repository commits never prove
  production deployment.
parameters:
  working_market:
    type: string
    required: false
    default: US and Canada
  source_ref:
    type: string
    required: false
    default: none-provided
  verified_offer_ref:
    type: string
    required: true
  site_source_ref:
    type: string
    required: false
    default: not-available
trigger:
  kind: manual
policy:
  autonomy: bounded
  allowed_actions:
  - read
  - research
  - write_local
  - review
  human_required_actions:
  - stage_paused
  - activate_live
  - change_budget
  - deploy_prod
  - send_message
  - emit_conversion
  default_gates:
  - landing-readiness
  max_parallel_tasks: 1
  allow_dynamic_children: false
gates:
- gate_id: landing-readiness
  kind: ai_independent
  required: true
  rubric: Site copy/CTA/consent/UTMs, safe DEV test, accessible preview and QA; production deployment needs independent
    permission.
  protected: false
  waivable: false
graph:
  nodes:
  - id: page-contract
    kind: task
    needs: []
    instructions: Plan truthful site claim/destination, navigation, responsive views, privacy/cookie consent and UTMs.
    inputs: []
    outputs:
    - artifact_id: page-contract-record
      path: artifacts/page-contract.md
      required: true
    quality:
      gates: []
      criteria:
      - Cite exact versioned artifacts; distinguish observed facts, inference, UNKNOWN and proposed actions
    contract:
      done_when: Each declared artifact exists with timestamp, source refs, producer actor, acceptance details and
        exact digest; a required QA review of this revision is recorded.
      on_failure: retry_bounded
    required_actions:
    - read
    - write_local
  - id: dev-preview-plan
    kind: task
    needs:
    - page-contract
    instructions: Draft DEV-only content and rollback map; log whether hosted preview actually exists or remains NOT_TESTED.
    inputs:
    - from: page-contract
      artifact_id: page-contract-record
      required: true
    outputs:
    - artifact_id: dev-preview-plan-record
      path: artifacts/dev-preview-plan.md
      required: true
    quality:
      gates: []
      criteria:
      - Cite exact versioned artifacts; distinguish observed facts, inference, UNKNOWN and proposed actions
    contract:
      done_when: Each declared artifact exists with timestamp, source refs, producer actor, acceptance details and
        exact digest; a required QA review of this revision is recorded.
      on_failure: retry_bounded
    required_actions:
    - read
    - write_local
  - id: page-peer-review
    kind: review
    needs:
    - dev-preview-plan
    instructions: Check page/CTA/accessibility/consent and actual preview as available; do not claim PROD without
      separate owner grant and readback.
    inputs:
    - from: dev-preview-plan
      artifact_id: dev-preview-plan-record
      required: true
    outputs:
    - artifact_id: page-peer-review-record
      path: artifacts/page-peer-review.md
      required: true
    quality:
      gates:
      - landing-readiness
      criteria:
      - Cite exact versioned artifacts; distinguish observed facts, inference, UNKNOWN and proposed actions
    contract:
      done_when: Each declared artifact exists with timestamp, source refs, producer actor, acceptance details and
        exact digest; a required QA review of this revision is recorded.
      on_failure: retry_bounded
    required_actions:
    - read
    - write_local
    review_gate: landing-readiness
