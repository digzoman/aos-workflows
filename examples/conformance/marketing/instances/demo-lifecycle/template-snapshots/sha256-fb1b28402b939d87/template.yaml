      manual_mapping_required: true
      provider_readback_cannot_be_inferred: true
      join_policy: all_accepted
      review_gate: evidence-integrity
      requires_child_acceptance: true
      no_auto_accept: true
      join_source: artifacts/research-child-proposals.json
      source_data_required: context.proposals + context.children + context.synthesis_approval for optional classifier;
        manual agent must check same files
