schema_version: 1.0.0
template_id: marketing-lifecycle-compound
version: 0.7.0
name: Compound market-research to advertising lifecycle (proposal and approval gated)
description: Optional file-only composition; research child fanout, human-verified deliverability, creative and parallel
  CRM/site/tracking prep, all-accepted integration, human live permit, read-only monitoring and separately permitted
  optimization. Never self-publish.
parameters:
  working_market:
    type: string
    required: false
    default: US and Canada
  source_ref:
    type: string
    required: false
    default: none-provided
  research_goal:
    type: string
    required: true
  target_buyer:
    type: string
    required: true
  brand_asset_ref:
    type: string
    required: true
trigger:
  kind: manual
policy:
  autonomy: bounded
  allowed_actions:
  - read
  - research
  - write_local
  - review
  human_required_actions:
  - stage_paused
  - activate_live
  - change_budget
  - deploy_prod
  - send_message
  - emit_conversion
  default_gates:
  - launch-permit
  max_parallel_tasks: 4
  allow_dynamic_children: true
gates:
- gate_id: launch-permit
  kind: human
  required: true
  rubric: Only authenticated owner may authorize exact campaign/adset/ad IDs, cap/budget, excluded holds, artifact
    versions, expiry and channel; no inferred consent.
  protected: true
  waivable: false
graph:
  nodes:
  - id: plan
    kind: task
    needs: []
    instructions: Resolve pinned marketing-research-plan module, require exact current review and preserve handoff.
      Parent stage is an acceptance boundary, NOT automatic execution.
    inputs: []
    outputs:
    - artifact_id: plan-record
      path: artifacts/plan.md
      required: true
    quality:
      gates: []
      criteria:
      - Cite exact versioned artifacts; distinguish observed facts, inference, UNKNOWN and proposed actions
    contract:
      done_when: Each declared artifact exists with timestamp, source refs, producer actor, acceptance details and
        exact digest; a required QA review of this revision is recorded.
      on_failure: retry_bounded
    required_actions:
    - read
    - write_local
    child_template_ref:
      template_id: marketing-research-plan
      version: 0.7.0
      content_digest: sha256:f21fd39fd79e6fd71f45be316333a27eb998015ab3c7a83efd8fa68565dc1615
      parameter_bindings: {}
      authorization_mode: per_child
    extensions:
      module_output: child_run_exact_accepted_artifact
      manual_mapping_required: true
      provider_readback_cannot_be_inferred: true
  - id: keywords
    kind: task
    needs:
    - plan
    instructions: Resolve pinned marketing-keyword-discovery module, require exact current review and preserve handoff.
      Parent stage is an acceptance boundary, NOT automatic execution.
    inputs:
    - from: plan
      artifact_id: plan-record
      required: true
    outputs:
    - artifact_id: keywords-record
      path: artifacts/keywords.md
      required: true
    quality:
      gates: []
      criteria:
      - Cite exact versioned artifacts; distinguish observed facts, inference, UNKNOWN and proposed actions
    contract:
      done_when: Each declared artifact exists with timestamp, source refs, producer actor, acceptance details and
        exact digest; a required QA review of this revision is recorded.
      on_failure: retry_bounded
    required_actions:
    - read
    - write_local
    child_template_ref:
      template_id: marketing-keyword-discovery
      version: 0.7.0
      content_digest: sha256:a8a1b7692e4c1566da75ec0ab8dccee1d80d7f6a7b85db6acaccf1a6dfecb076
      parameter_bindings: {}
      authorization_mode: per_child
    extensions:
      module_output: child_run_exact_accepted_artifact
      manual_mapping_required: true
      provider_readback_cannot_be_inferred: true
  - id: research-fanout
    kind: child_generator
    needs:
    - keywords
    instructions: From reviewed plan and keyword queue propose stable separate vertical children; parent does not
      create or accept a child without independent owner scope. Evidence reports remain UNKNOWN until performed.
    inputs:
    - from: keywords
      artifact_id: keywords-record
      required: true
    outputs:
    - artifact_id: research-fanout-record
      path: artifacts/research-child-proposals.json
      required: true
    quality:
      gates: []
      criteria:
      - Cite exact versioned artifacts; distinguish observed facts, inference, UNKNOWN and proposed actions
    contract:
      done_when: Only stable PROPOSED child entries exist with exact template pin, buyer, market, outputs and QC;
        actual child materialization requires separate owner instantiation approval.
      on_failure: retry_bounded
    required_actions:
    - read
    - write_local
    child_template_ref:
      template_id: marketing-competitor-execution
      version: 0.7.0
      content_digest: sha256:7a627e90213897925d75fbe4fba875ad007dd38e753ddcfee55bb4bd18517a47
      parameter_bindings: {}
      authorization_mode: per_child
    extensions:
      module_output: child_run_exact_accepted_artifact
      manual_mapping_required: true
      provider_readback_cannot_be_inferred: true
    fanout:
      child_template_id: marketing-competitor-execution
      child_template_version: 0.7.0
      proposals_artifact: research-fanout-record
      authorization_mode: per_child
      max_children: 15
      id_strategy: stable_parent_slug_source_revision
  - id: research-peer-review
    kind: task
    needs:
    - research-fanout
    instructions: Resolve pinned marketing-research-quality-review module, require exact current review and preserve
      handoff. Parent stage is an acceptance boundary, NOT automatic execution.
    inputs:
