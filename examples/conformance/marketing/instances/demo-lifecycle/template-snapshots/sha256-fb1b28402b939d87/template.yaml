  - id: evidence
    kind: join
    needs:
    - research-peer-review
    instructions: After approved children have run and each has a current, independently verified evidence QC PASS,
      use a separate scope-bound synthesis approval; an incomplete or REVISE child blocks this join. Keep other parallel
      tasks independent.
    inputs:
    - from: research-fanout
      artifact_id: research-fanout-record
      required: true
    - from: research-peer-review
      artifact_id: research-peer-review-record
      required: true
    outputs:
    - artifact_id: evidence-record
      path: artifacts/evidence.md
      required: true
    quality:
      gates: []
      criteria:
      - Cite exact versioned artifacts; distinguish observed facts, inference, UNKNOWN and proposed actions
    contract:
      done_when: Every required child is COMPLETE with current independently reviewed PASS on exact evidence digests,
        and parent synthesis approval valid; preserve source lineage.
      on_failure: retry_bounded
    required_actions:
    - read
    - write_local
    child_template_ref:
      template_id: marketing-evidence-consolidation
      version: 0.7.0
      content_digest: sha256:a4e5c99d0ec52e2ab6dc5c48291b48ef86c2d74d8dd81bbfb4abcb2e6e675f89
      parameter_bindings: {}
      authorization_mode: per_child
    extensions:
